version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ebonia_qdrant
    ports:
      - "127.0.0.1:6333:6333"  # REST API, accessible only from this host
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  qdrant_data:
